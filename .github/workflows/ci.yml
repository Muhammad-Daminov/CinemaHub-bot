name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - run: pip install -r requirements-dev.txt

      # The settings object requires these at import time. Values are
      # placeholders — no test reaches a real service, and DB-backed tests
      # skip unless TEST_DATABASE_URL is set (see tests/conftest.py).
      - name: Import check
        env:
          BOT_TOKEN: ci-placeholder
          TMDB_API_KEY: ci-placeholder
          GEMINI_API_KEY: ci-placeholder
          DATABASE_URL: postgresql+asyncpg://ci:ci@localhost/ci
        run: python -c "import app.main"

      - name: Locale parity
        run: python scripts/check_locales.py

      - name: Tests
        env:
          BOT_TOKEN: ci-placeholder
          TMDB_API_KEY: ci-placeholder
          GEMINI_API_KEY: ci-placeholder
          DATABASE_URL: postgresql+asyncpg://ci:ci@localhost/ci
        run: python -m pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: webapp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: webapp/package-lock.json

      - run: npm ci
      - run: npm run build
