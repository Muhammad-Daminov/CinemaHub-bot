name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - run: pip install -r requirements-dev.txt

      # The settings object requires these at import time. Values are
      # placeholders — no test reaches a real service, and DB-backed tests
      # skip unless TEST_DATABASE_URL is set (see tests/conftest.py).
      #
      # BOT_TOKEN is the exception: it must be *shaped* like a real token
      # (`<digits>:<something>`), because app.bot.instance constructs the
      # Bot at import time and aiogram validates the format there. A plain
      # word failed with "Token is invalid!" and took the whole backend job
      # down at the first step. Still a placeholder — it authenticates
      # nothing, and nothing here calls Telegram.
      - name: Import check
        env:
          BOT_TOKEN: "123456:ci-placeholder"
          TMDB_API_KEY: ci-placeholder
          GEMINI_API_KEY: ci-placeholder
          DATABASE_URL: postgresql+asyncpg://ci:ci@localhost/ci
        run: python -c "import app.main"

      - name: Locale parity
        run: python scripts/check_locales.py

      - name: Tests
        env:
          BOT_TOKEN: "123456:ci-placeholder"
          TMDB_API_KEY: ci-placeholder
          GEMINI_API_KEY: ci-placeholder
          DATABASE_URL: postgresql+asyncpg://ci:ci@localhost/ci
        run: python -m pytest -q

  # Installs ONLY the runtime manifest, the way Render's build does, and
  # imports the application. The other job installs requirements-dev.txt,
  # which is a superset — so a runtime dependency missing from
  # requirements.txt passed every gate here and crashed only in
  # production, serving a build two phases old for a day. This job is the
  # one that would have caught it.
  runtime-deps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - name: Install runtime dependencies only
        run: pip install -r requirements.txt

      - name: Import check on a clean runtime environment
        env:
          BOT_TOKEN: "123456:ci-placeholder"
          TMDB_API_KEY: ci-placeholder
          GEMINI_API_KEY: ci-placeholder
          DATABASE_URL: postgresql+asyncpg://ci:ci@localhost/ci
        run: python -c "import app.main"

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: webapp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: webapp/package-lock.json

      - run: npm ci
      - run: npm run build
